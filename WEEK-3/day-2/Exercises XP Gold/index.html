<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Table Diagonal</title>
  <style>
    table {
      border-collapse: collapse;
    }
    
    td {
      border: 1px solid black;
      padding: 3px 5px;
      width: 30px;
      height: 30px;
      text-align: center;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td>1:1</td>
      <td>2:1</td>
      <td>3:1</td>
      <td>4:1</td>
      <td>5:1</td>
    </tr>
    <tr>
      <td>1:2</td>
      <td>2:2</td>
      <td>3:2</td>
      <td>4:2</td>
      <td>5:2</td>
    </tr>
    <tr>
      <td>1:3</td>
      <td>2:3</td>
      <td>3:3</td>
      <td>4:3</td>
      <td>5:3</td>
    </tr>
    <tr>
      <td>1:4</td>
      <td>2:4</td>
      <td>3:4</td>
      <td>4:4</td>
      <td>5:4</td>
    </tr>
    <tr>
      <td>1:5</td>
      <td>2:5</td>
      <td>3:5</td>
      <td>4:5</td>
      <td>5:5</td>
    </tr>
  </table>

  <script >
    
// Get the table element using DOM
let table = document.body.firstElementChild;

// Get all rows in the table
let rows = table.querySelectorAll('tr');

// Loop through each row
for (let rowIndex = 0; rowIndex < rows.length; rowIndex++) {
  // Get all cells (td) in the current row
  let cells = rows[rowIndex].querySelectorAll('td');
  
  // Loop through each cell in the row
  for (let cellIndex = 0; cellIndex < cells.length; cellIndex++) {
    // Check if cell is on the main diagonal (rowIndex === cellIndex)
    // OR on the anti-diagonal (rowIndex + cellIndex === rows.length - 1)
    if (rowIndex === cellIndex || rowIndex + cellIndex === rows.length - 1) {
      // Change the background color to red
      cells[cellIndex].style.backgroundColor = 'red';
      // Change text color to white for better visibility
      cells[cellIndex].style.color = 'white';
    }
  }
}

  </script>
</body>
</html>
