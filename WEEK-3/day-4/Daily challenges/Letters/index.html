<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Daily Challenge: Letters</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: #007bff;
        }
    </style>
</head>
<body>
    <h1>Show Only Letters</h1>
    <p>Enter text below - only letters will be accepted</p>
    
    <label for="letterInput">Enter text:</label>
    <input type="text" id="letterInput" placeholder="Type only letters here...">

    <script >
        // Get the input element
const input = document.getElementById('letterInput');

// Listen to the 'input' event - fires every time value changes
input.addEventListener('input', function() {
    // Remove any character that is not a letter using regex
    // /[^a-zA-Z]/g matches any character that is NOT a-z or A-Z
    this.value = this.value.replace(/[^a-zA-Z]/g, '');
});

    </script>
</body>
</html>
