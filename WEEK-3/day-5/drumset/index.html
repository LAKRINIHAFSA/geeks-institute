
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Drumset 🎵</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay"></div> <!-- gradient overlay -->
    <h1>Drumset :</h1>
    <div class="drum-container">
        <button class="drum" data-sound="kick">Kick (A)</button>
        <button class="drum" data-sound="snare">Snare (S)</button>
        <button class="drum" data-sound="hihat">Hi-Hat (D)</button>
        <button class="drum" data-sound="openhat">openhat (F)</button>
        <button class="drum" data-sound="ride">ride (G)</button>
        <button class="drum" data-sound="tom">tom (H)</button>
        <button class="drum" data-sound="boom">boom (B)</button>
        <button class="drum" data-sound="tink">tink (T)</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
