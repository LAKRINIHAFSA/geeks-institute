<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coloring Squares</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1> Coloring Squares</h1>

  <!-- Color picker section -->
  <div class="color-picker">
    <label for="color">Select a color:</label>
    <input type="color" id="color" value="#ff69b4">

    <!-- Extra color buttons -->
    <button class="preset" data-color="#ff69b4">Pink</button>
    <button class="preset" data-color="#ba55d3">Mauve</button>
    <button class="preset" data-color="#87cefa">Light Blue</button>
    <button class="preset" data-color="#98fb98">Light Green</button>
    <button class="preset" data-color="#f0e68c">Yellow</button>
    <button id="clear">Clear All</button>
  </div>

  <!-- Grid container -->
  <div class="container" id="grid"></div>

  <script src="script.js"></script>
</body>
</html>
