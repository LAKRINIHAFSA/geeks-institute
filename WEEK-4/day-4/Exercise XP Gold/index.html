<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Exercise 1</title>
</head>
<body>
  <!-- Form with name, lastname, and submit button -->
  <form action="display.html" method="GET"> <!-- send data via GET to another HTML file -->
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
    <br><br>

    <label for="lastname">Last Name:</label>
    <input type="text" id="lastname" name="lastname" required>
    <br><br>

    <input type="submit" value="Send"> <!-- submit button -->
  </form>
</body>
</html>
