<!-- Buttons Section -->
    <div class="buttons">
      <button id="generate">Generate Quote</button>
      <button id="charWithSpaces">Characters (with spaces)</button>
      <button id="charWithoutSpaces">Characters (no spaces)</button>
      <button id="wordCount">Word Count</button>
      <button id="likeBtn">❤️ Like:0</button>
    </div>

    <!-- Add New Quote Form -->
    <div class="add-quote">
      <h2>Add a New Quote</h2>
      <input type="text" id="newQuote" placeholder="Enter quote">
      <input type="text" id="newAuthor" placeholder="Enter author">
      <button id="addQuoteBtn">Add Quote</button>
    </div>

    <!-- Filter by Author -->
    <div class="filter-section">
      <h2>Filter Quotes by Author</h2>
      <input type="text" id="filterAuthor" placeholder="Enter author name">
      <button id="filterBtn">Filter</button>
      <div class="nav-buttons">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
