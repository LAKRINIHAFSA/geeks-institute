
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Tic Tac Toe</title>
  <link href="https://fonts.cdnfonts.com/css/orbitron" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main container -->
  <div class="container">
    <h1> AI Tic Tac Toe</h1>

    <!-- Symbol selection -->
    <div class="controls">
      <button id="chooseX" class="btn active">Play X</button>
      <button id="chooseO" class="btn">Play O</button>

      <button id="easyBtn" class="btn">Easy</button>
      <button id="hardBtn" class="btn active">Hard</button>
    </div>

    <!-- Board -->
    <div id="board" class="board">
      <!-- 9 cells will be generated by JS -->
    </div>

    <!-- Status messages -->
    <div id="status" class="status">Choose X or O to start</div>
    <button id="restartBtn" class="btn">Restart Game</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
