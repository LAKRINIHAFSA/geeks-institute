<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokedex App</title>
  <style>
    body { background: #efefef; font-family: Arial, sans-serif; }
    .pokedex { background: #ff5350; border-radius: 15px; width: 350px; padding: 24px; margin: 40px auto; box-shadow: 0 6px 24px #0005; }
    .header { text-align: center; }
    .screen { background: #fff; border-radius: 10px; min-height: 200px; padding: 16px; text-align: center; margin-bottom: 24px; }
    .loading { font-size: 2em; color: #f8d63b; }
    img.pokemon { max-width: 150px; margin: 12px auto; display: block; }
    .nav-buttons { display: flex; justify-content: space-between; margin-top: 18px; }
    .nav-buttons button { background: #3c5aa6; color: #fff; border: none; border-radius: 5px; padding: 10px 18px; font-size: 1.1em; cursor: pointer; }
    .nav-buttons button:hover { background: #204296; }
    .type { background: #4ad572; color: #fff; font-weight: bold; padding: 5px 14px; border-radius: 14px; display: inline-block; margin-top: 7px; }
    .error { color: #ff4242; font-weight: bold; }
  </style>
</head>
<body>
  <div class="pokedex">
    <div class="header">
      <h1>Pokedex</h1>
    </div>
    <div id="screen" class="screen"></div>
    <div class="nav-buttons">
      <button id="prevBtn">PREVIOUS</button>
      <button id="randomBtn">RANDOM</button>
      <button id="nextBtn">NEXT</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
