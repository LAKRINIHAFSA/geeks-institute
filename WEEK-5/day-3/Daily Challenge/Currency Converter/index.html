<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Currency Converter</title>
  <style>
    /* Body & Container */
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.container {
  background: rgba(255, 255, 255, 0.05);
  padding: 30px 40px;
  border-radius: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
  max-width: 420px;
  width: 100%;
  text-align: center;
}

/*  Headings  */
h2 {
  font-size: 2.2rem;
  color: #ffcc00;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
  margin-bottom: 25px;
}

/*  Form Elements  */
label {
  display: block;
  margin: 15px 0 5px;
  font-weight: bold;
  text-align: left;
}
select, input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 1em;
  margin-bottom: 15px;
  outline: none;
  background: rgba(255,255,255,0.1);
  color: #fff;
}
select option {
  color: #000;
}

/*Buttons */
button {
  cursor: pointer;
  border: none;
  padding: 12px 0;
  border-radius: 8px;
  font-size: 1.1em;
  margin: 10px 5px 15px 5px;
  transition: all 0.3s ease;
  font-weight: bold;
}
#convert {
  background: #25b96a;
  color: #fff;
  width: 100%;
}
#convert:hover {
  background: #169d51;
}
#switch {
  background: #f4bc35;
  color: #333;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 1.4rem;
  margin: 25px 0;
}
#switch:hover {
  background: #e0a200;
}

/*  Result  */
.result {
  margin-top: 20px;
  font-size: 1.3em;
  font-weight: bold;
  background: rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  word-break: break-word;
}

/*  Row for From & To */
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.row > div {
  flex: 1;
}

  </style>
</head>
<body>
  <div class="container">
    <h2>Currency Converter</h2>
    <div class="row">
      <div>
        <label for="from">From Currency:</label>
        <select id="from"></select>
      </div>
      <button id="switch" title="Switch currencies">&#x21c4;</button>
      <div>
        <label for="to">To Currency:</label>
        <select id="to"></select>
      </div>
    </div>
    <label for="amount">Amount:</label>
    <input type="number" id="amount" min="0" step="any" value="1">
    <button id="convert">Convert</button>
    <div class="result" id="result"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
