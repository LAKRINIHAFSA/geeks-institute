<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Star Wars AJAX App</title>
  <!-- FontAwesome for loading icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
  <style>
    body { font-family: "Segoe UI", sans-serif; padding: 20px; background: #ebb9f5; color: #f1a1de; text-align: center; }
      h1 {color: #ff00ee;margin-bottom: 20px;font-size: 3rem;margin-bottom: 20px; text-shadow: 0 0 10px rgb(15, 13, 15);}
    .card { background: #f8f4f4; padding: 24px; margin: 24px auto; border-radius: 8px; max-width: 400px;  box-shadow: 0 0 10px rgb(212, 29, 170);transition: transform 0.3s;}
    .card:hover { transform: scale(1.05); }
    .loading { color: #ef88e1; text-align: center; font-size: 2em; margin-top: 30px; }
    .error { color: #ff5555; text-align: center; margin-top: 30px; }
    .btn { background: #ff1fb8; border: none; border-radius: 4px; padding: 12px 20px; font-size: 1em; cursor: pointer; margin-top: 24px; }
    .btn:hover { background: #d888e1; }
    .info { margin-top: 24px; }
  </style>
</head>
<body>
  <h1>Star Wars Character Info</h1>
  <button id="random-btn" class="btn">Get Random Character</button>
  <div id="display-zone"></div>
  <script src="app.js"></script>
</body>
</html>
